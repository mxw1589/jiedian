name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify checksums
        run: sha256sum -c SHA256SUMS.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check shell syntax
        run: bash -n repair.sh install.sh install-from-github.sh
      - name: Compile Python files
        run: python -m py_compile patch_sb.py tests/test_patch.py
